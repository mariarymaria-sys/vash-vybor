<title>Педагогическая игра «Ваш выбор»</title>
<style>
:root{color-scheme:light;--bg:#f5efe3;--card:#fbf8f2;--ink:#3b2f5c;--soft:#5d5380;--lil:#b9a7d9;--lilp:#e8e0f3;--lild:#6b4fa0;--mint:#a8dcc3;--mintp:#dcefe5;--mintd:#2f7d61;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(circle at 8% 10%,var(--lilp) 0,transparent 32%),radial-gradient(circle at 92% 90%,var(--mintp) 0,transparent 34%),var(--bg)}
main{max-width:760px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.15;margin:0 0 16px}
h2{font-size:clamp(24px,4.5vw,32px);line-height:1.2;margin:0 0 18px}
p{margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--lil);border-radius:20px;padding:24px;margin-bottom:16px}
.btn{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--lilp);border:2px solid var(--lil);border-radius:16px;padding:16px 18px;margin:0 0 12px;cursor:pointer}
.btn:hover,.btn:focus-visible{background:var(--mintp);border-color:var(--mintd);outline:none}
.main{background:var(--mint);border-color:var(--mintd);text-align:center;font-size:20px}
.main:hover{background:#95d0b6}
.rnd{background:var(--card);text-align:center;border-style:dashed}
.sub{color:var(--soft);font-size:16px}
.bar{height:10px;background:var(--lilp);border-radius:5px;margin:0 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mintd);border-radius:5px}
.tag{display:inline-block;font-size:14px;font-weight:700;border-radius:10px;padding:2px 10px;margin-bottom:6px}
.t2{background:var(--mintp);color:var(--mintd)}.t1{background:var(--lilp);color:var(--lild)}.t0{background:#efe6d6;color:#7a5a2a}
.hero{text-align:center;padding-top:12vh}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:24px}
.dots i{width:44px;height:44px;border-radius:50%}
</style></head><body><main id="app"></main>

a:{n:'6,5–11 лет (Начальная школа)',c:[
{t:'Алина, 8 лет: трудности с социализацией',d:'Алина, 8 лет, 2 класс. На переменах она одна, не участвует в играх, в группе молчит. Мама говорит, что дома девочка общительна и весёлая. Одноклассники к ней не обращаются.',
q:[{q:'С чего вы начнёте работу?',o:[['Понаблюдаю за Алиной на уроках и переменах, поговорю с ней наедине',2,'Диагностика и беседа помогают понять причину до вмешательства.'],['Попрошу класс при всех принять Алину',0,'Публичное давление усиливает неловкость и не учитывает причин.'],['Подожду: освоится сама',1,'Адаптация возможна, но без поддержки затягивается.']]},
{q:'Как включить девочку в коллектив?',o:[['Дам парное поручение с доброжелательным одноклассником',2,'Совместная деятельность — основа организации общения (А. С. Макаренко).'],['Сделаю замечание за замкнутость',0,'Порицание закрепляет тревожность.'],['Порекомендую родителям кружок, дальше не вмешиваюсь',1,'Кружок полезен, но без связи со школьным классом эффект частичный.']]},

q:[{q:'Какой ваш первый шаг?',o:[['Понаблюдаю, когда поведение усиливается, и обсужу с родителями и психологом',2,'Диагностика причин и сотрудничество с семьёй.'],['Рассажу подальше и буду писать замечания в дневник',0,'Наказание без выяснения причин не меняет поведение.'],['Повторю правила для всего класса',1,'Правила нужны, но индивидуальной работы не заменяют.']]},
{q:'Что вы сделаете на уроках?',o:[['Введу двигательные паузы и поручения (раздать тетради)',2,'Учёт возрастных особенностей и метод поручений.'],['Потребую сидеть неподвижно весь урок',0,'Игнорируется потребность первоклассника в движении.'],['Буду хвалить, только когда он сидит тихо',1,'Поощрение полезно, но цель слишком узкая.']]},

{t:'Ярослав, 9 лет: объект насмешек',d:'Ярослав, 9 лет, 3 класс. Он медленно читает, одноклассники дразнят его и передразнивают. Мальчик стал неохотно ходить в школу, на переменах плачет. Родители пока ничего не знают.',
q:[{q:'Что вы сделаете первым?',o:[['Поговорю с Ярославом наедине, затем понаблюдаю за классом',2,'Беседа и наблюдение: сначала выяснить ситуацию.'],['Соберу класс и назову обидчиков',0,'Публичное осуждение порождает новый конфликт.'],['Посоветую не обращать внимания',1,'Не снимает проблему и оставляет ребёнка одного.']]},

{t:'Артём, 15 лет: потеря интереса к учёбе',d:'Артём, 15 лет, 9 класс. Раньше учился хорошо, теперь пропускает уроки и говорит: «Мне это не пригодится». Друзья занимаются другим, в классе он отстранён.',
q:[{q:'Как вы выясните причину?',o:[['Побеседую с Артёмом и учителями-предметниками',2,'Комплексная диагностика причин.'],['Сообщу родителям и поставлю на внутришкольный учёт',0,'Формальная мера без выяснения причин.'],['Проведу общий разговор о важности учёбы',1,'Убеждение без индивидуального подхода неэффективно.']]},
{q:'Как вернуть мотивацию?',o:[['Организую профориентационную встречу или экскурсию',2,'Профориентация возвращает смысл обучения.'],['Пообещаю хорошую оценку за возвращение',1,'Внешняя награда даёт краткий эффект.'],['Сравню с успешными одноклассниками',0,'Сравнение снижает мотивацию.']]},
{q:'Как закрепить результат?',o:[['Составлю индивидуальный план и буду регулярно подводить итоги',2,'Метод перспективных линий (А. С. Макаренко).'],['Назначу доп. занятия по пропущенным темам без обсуждения',1,'Помощь нужна, но без мотива не работает.'],['Прекращу контроль после первых успехов',0,'Возврат к прежнему поведению.']]}],

q:[{q:'С чего вы начнёте?',o:[['Выслушаю Софью, выясню её интересы и ожидания',2,'Эмпатия и диалог: уважение к личности.'],['Объясню, что надо прислушаться к родителям',0,'Игнорируется право на самоопределение.'],['Посоветую поменьше переживать',1,'Не решает проблему.']]},

const app=document.getElementById('app'),L=['Ситуация осталась нерешённой','Частичное решение','Эффективное решение'],T=['Малоэффективно','Частично','Конструктивно'];
let S={};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},

dots='<div class="dots"><i style="background:#b9a7d9"></i><i style="background:#a8dcc3"></i><i style="background:#9a84c9"></i></div>';
function start(){v(`<div class="hero">${dots}<h1>Педагогическая игра «Ваш выбор»</h1><p class="sub">Примите педагогические решения и посмотрите, к чему они приведут</p><button class="btn main" onclick="ages()">Начать</button></div>`)}
function ages(){v(`<h2>Выберите возрастную категорию детей</h2>${Object.keys(D).map(k=>`<button class="btn" onclick="list('${k}')">${D[k].n}</button>`).join('')}<button class="btn rnd" onclick="rcase()">Случайный выбор</button><button class="btn rnd" onclick="start()">← В начало</button>`)}
function list(k){S.k=k;v(`<h2>Выберите кейс</h2><p class="sub">${D[k].n}</p>${sh(D[k].c.map((c,i)=>[c,i])).map(([c,i])=>`<button class="btn" onclick="desc('${k}',${i})">${c.t}</button>`).join('')}<button class="btn rnd" onclick="desc('${k}',${rnd(D[k].c.length)})">Случайный выбор</button><button class="btn rnd" onclick="ages()">← К возрастным категориям</button>`)}
function rcase(){const k=Object.keys(D)[rnd(3)];desc(k,rnd(D[k].c.length))}
function desc(k,i){S={k,i,n:0,ch:[],f:{},st:1};const c=D[k].c[i];v(`<p class="sub">${D[k].n}</p><h2>${c.t}</h2><div class="card"><p>${c.d}</p></div><button class="btn main" onclick="ask()">Приступить</button><button class="btn rnd" onclick="list('${k}')">← К выбору кейса</button>`)}
function ask(){const c=D[S.k].c[S.i],q=c.q[S.n];S.o=sh(q.o);v(`<div class="bar"><i style="width:${S.n/c.q.length*100}%"></i></div><p class="sub">${c.t} · Вопрос ${S.st}${c.end?'':' из '+c.q.length}</p>${q.k?`<span class="tag t1">${q.k}</span>`:''}<h2>${q.q}</h2>${S.o.map((o,j)=>`<button class="btn" onclick="pick(${j})">${o[0]}</button>`).join('')}`)}
function pick(j){const c=D[S.k].c[S.i];S.ch.push({q:c.q[S.n].q,o:S.o[j],r:c.q[S.n].r,b:c.q[S.n].o.find(o=>o[1]==2)});const o=S.o[j],g=o[4]||'';if(g){const k=g.slice(1);S.f[k]=g[0]=='+'?(S.f[k]||0)+1:0}S.n=nx(c,S.n+1);S.st++;S.n<0?res():ask()}
function res(){const c=D[S.k].c[S.i];if(c.end)return res2(c);let s=S.ch.reduce((a,x)=>a+x.o[1],0),t=s/(2*c.q.length)>=.75?2:s/(2*c.q.length)>=.45?1:0;
v(`<p class="sub">${c.t}</p><h2>Итог: ${L[t]}</h2><p class="sub">Баллов: ${s} из ${2*c.q.length}</p><div class="card"><p><b>${c.e[t]}</b></p></div><h2 style="font-size:22px">Разбор ваших действий</h2>${S.ch.map(x=>`<div class="card"><p class="sub">${x.q}</p><span class="tag t${x.o[1]}">${T[x.o[1]]}</span><p><b>Ваш выбор: ${x.o[0]}</b></p>${x.r?`${x.o[1]<2?`<p><b>Оптимальный вариант:</b> ${x.b[0]}</p>`:''}<p>${x.r}</p>`:`<p>${x.o[2]}</p>`}</div>`).join('')}<button class="btn main" onclick="desc('${S.k}',${S.i})">Пройти кейс заново</button><button class="btn" onclick="list('${S.k}')">Другой кейс этой категории</button><button class="btn" onclick="ages()">Другая возрастная категория</button>`)}
D.a.c[0]={t:'Алина, 8 лет: трудности с социализацией',d:'Алина, 8 лет, 2 класс. На переменах одна, не участвует в играх, в группе молчит. Мама говорит, что дома девочка общительна и весёлая. Одноклассники к ней не обращаются. Вам предстоит вести этот кейс несколько недель: от диагностики до закрепления результата.',
q:[{k:'Диагностика',q:'Вы заметили, что Алина изолирована. Какой метод диагностики выберете в первую очередь?',o:[['Наблюдение в разных ситуациях (урок, перемена, группа) с записью в дневнике наблюдений',2],['Публичная социометрия: попрошу весь класс написать, с кем они дружат',1],['Опора на мнение одного учителя-предметника',0]],r:'Наблюдение в естественных условиях даёт объективную картину и не травмирует ребёнка. Социометрия показывает статус в группе, но не объясняет причин, а в 8 лет требует большой осторожности. Мнение одного педагога субъективно и не заменяет собственных данных.'},
{k:'Беседа',q:'Вы решили поговорить с Алиной. Как построить разговор?',o:[['В спокойной обстановке, начав с её интересов и задавая открытые вопросы',2],['Пригласить вместе с мамой и обсудить поведение в классе',1],['Сразу спросить, почему она не играет с детьми',0]],r:'Доверительный тон и открытые вопросы снимают напряжение и показывают принятие. Присутствие мамы может помочь, но смещает фокус на «поведение» и создаёт давление. Прямой вопрос «почему» ставит ребёнка в оборону и вызывает ещё большее замыкание.'},
{k:'Работа с семьёй',q:'Мама говорит: «Дома она болтает без умолку, в школе просто стесняется». Как вы это используете?',o:[['Договорюсь о регулярной связи, узнаю интересы и страхи, попрошу поддерживать рассказы о школе без оценок',2],['Заверю, что со временем пройдёт, и отложу разговор',1],['Порекомендую нанять специалиста по «общению» и дальше не вмешиваться',0]],r:'Партнёрство с семьёй даёт информацию о ресурсах ребёнка и единый подход дома и в школе. Ожидание «само пройдёт» теряет время адаптации. Перекладывание проблемы на специалиста снимает ответственность с педагога и не решает ситуацию в классе.'},
{k:'Планирование',q:'Какую цель вы поставите на первый месяц?',o:[['Алина найдёт 1–2 контакта и сможет участвовать в совместной работе',2],['Улучшить отношения во всём классе',1],['Добиться, чтобы Алина выступала перед классом',0]],r:'Цель должна быть реалистичной и измеримой, а шаги постепенными. Работа со всем классом полезна, но слишком общая для первого этапа. Публичное выступление для замкнутого ребёнка — стресс, а не цель адаптации.'},
{k:'Ситуация: перемена',q:'На перемене дети играют, Алина стоит в стороне и смотрит. Что вы сделаете?',o:[['Подойду к Алине, предложу присоединиться вместе, а когда включится, отойду',2],['Попрошу детей взять Алину в игру',1],['Не буду вмешиваться, чтобы не давить',0]],r:'Ребёнку важна «страховка» взрослого на первых шагах, а затем самостоятельность. Просьба к детям работает, но может восприниматься как обязанность и вызывать формальное отношение. Невмешательство оставляет Алину один на один с тревогой.'},
{k:'Ситуация: групповая работа',q:'Предстоит работа в группах по четыре человека. Как сформируете группу для Алины?',o:[['Подберу доброжелательных, терпеливых детей и дам Алине роль с понятной задачей',2],['Поставлю с самыми активными лидерами',1],['Разрешу детям выбрать группы самим',0]],r:'Подбор партнёров и чёткая роль создают ситуацию успеха (В. А. Сухомлинский). Лидеры могут «заслонить» Алину и закрепить пассивность. При свободном выборе замкнутые дети часто остаются без группы, и изоляция усиливается.'},
{k:'Ситуация: конфликт',q:'Дети зовут Алину играть, она отказывается. Один мальчик говорит: «Ну и не надо, она странная». Как вы поступите?',o:[['Спокойно объясню, что каждому нужно время, предложу мальчику другую форму приглашения, позже поговорю с ним отдельно',2],['Не обращу внимания: дети просто так сказали',1],['Строго сделаю замечание мальчику перед всем классом',0]],r:'Спокойная реакция сохраняет достоинство обоих детей и учит эмпатии. Игнорирование оставляет высказывание без оценки взрослого и делает его нормой. Публичное замечание закрепит за Алиной ярлык «причины конфликта» и вызовет раздражение к ней.'},
{k:'Анализ динамики',q:'Через месяц какие признаки покажут, что работа даёт результат?',o:[['Алина сама начинает контакт, участвует в играх, рассказывает о школе',2],['Хорошие оценки и отсутствие жалоб',1],['Алина стала тише и выполняет всё, что скажут',0]],r:'Показатели социализации — это инициатива, участие и эмоциональная открытость. Успеваемость и отсутствие жалоб важны, но не отражают качество общения. Послушание и тишина могут быть признаком подавленности, а не адаптации.'},
{k:'Коллективное мероприятие',q:'Какой формат классного часа лучше всего поддержит сплочение класса?',o:[['Командная игра на сотрудничество с рефлексией «Что нам помогло»',2],['Беседа-лекция о правилах дружбы',1],['Соревнование команд с призами',0]],r:'Совместная деятельность с общей целью и рефлексия формируют коллектив (А. С. Макаренко, Л. И. Новикова). Лекция передаёт знания, но не создаёт опыта общения. Соревнование с победителями усиливает разобщённость и тревогу у неуверенных детей.'},
{k:'Рефлексия',q:'Как вы завершите работу по этому кейсу?',o:[['Подведу итоги с Алиной и родителями, зафиксирую, что помогло, и спланирую дальнейшую поддержку',2],['Сообщу родителям, что проблема решена',1],['Перейду к другим задачам: цель достигнута',0]],r:'Воспитание — длительный процесс, результат нужно закрепить и сделать осознанным для ребёнка и семьи. Простое сообщение о «решении» не фиксирует приёмы, которые сработали. Прекращение внимания может привести к откату.'}],
e:['Большая часть выбранных действий не отвечала на причины ситуации: диагностика, работа с семьёй и поддержка Алины были неполными, а некоторые меры (давление, публичные замечания, пассивное ожидание) могли усилить замкнутость. Для устойчивого результата нужно опираться на наблюдение и беседу, выстраивать партнёрство с семьёй, создавать ситуации успеха и закреплять динамику. Пройдите кейс ещё раз и сравните свои решения с разбором.','Вы верно выбрали часть шагов: многие решения показывают понимание личностно-ориентированного подхода. Но в нескольких моментах решения были слишком общими, поспешными или не подкреплены последовательной работой с ребёнком, классом и семьёй. Поэтому результат частичный: динамика есть, но она неустойчива. Обратите внимание на вопросы, где выбран не оптимальный вариант.','Вы выстроили системную работу: от диагностики и беседы до планирования, групповой деятельности, работы с коллективом и рефлексии. Ваши решения опираются на принципы постепенности, личностно-ориентированного подхода, сотрудничества с семьёй и создания ситуации успеха. Такая последовательность позволяет решить текущую проблему и закрепить навыки общения Алины, и это признак профессиональных действий педагога.']};
D.a.c[0]={...D.a.c[0],q:[
{k:'Диагностика',q:'Две недели наблюдений: Алина молчит на уроках, на переменах рисует одна и иногда поглядывает на группу девочек. Что дальше?',o:[['Продолжу наблюдение по плану и запрошу информацию у родителей и учителя 1 класса о её прежнем поведении',2],['Сразу обращусь к психологу с запросом на диагностику',1],['Поручу ей раздавать тетради: тихая и аккуратная, пусть будет на виду',1],['Проведу социометрию, чтобы увидеть место Алины в классе',0]],r:'Сравнение с прошлым годом показывает, новая это особенность или устойчивая, а две недели наблюдений — малая выборка. Психолог нужен, но запрос без данных педагога размыт. Поручение до выяснения причин может усилить напряжение у ребёнка, которому неуютно «на виду». Социометрия в 8 лет публична и не объясняет причин.'},
{k:'Работа с семьёй',q:'Мама тревожно просит: «Скажите честно, что с ней не так?» Как вы ответите?',o:[['Опишу конкретные наблюдения без оценок и диагнозов и спрошу, что мама замечает дома',2],['Порекомендую срочно обратиться к детскому психологу',1],['Скажу, что это возрастное и беспокоиться не стоит',0],['Скажу, что причина, возможно, в семье, и расспрошу об отношениях дома',0]],r:'Факты без ярлыков снимают тревогу и приглашают маму к сотрудничеству. Совет к психологу допустим, но без обсуждения наблюдений звучит как приговор. Успокоение «возрастное» обесценивает тревогу и теряет время. Предположение о вине семьи разрушает доверие и выходит за профессиональную роль педагога.'},
{k:'Доверительный разговор',q:'Алина говорит: «С вами интересно, а с детьми нет — они меня не берут». Что для вас приоритетно?',o:[['Поблагодарить за доверие, уточнить, что именно происходит, не обещая «всё исправить»',2],['Предложить ей рассказывать мне каждый день, как прошла перемена',1],['Пообещать, что сразу поговорю с детьми',0],['Сказать: «Просто подойди и попроси взять тебя»',0]],r:'Принятие и уточнение сохраняют доверие и не дают невыполнимых обещаний. Ежедневные отчёты поддерживают контакт, но привязывают ребёнка к педагогу вместо сверстников. Разговор с детьми «сразу» может раскрыть слова Алины и подвести её. Простой совет игнорирует то, что именно этого она и боится.'},
{k:'Планирование',q:'В неделю у вас есть ресурс на одну системную меру. Что выберете?',o:[['Регулярное парное задание с одним и тем же доброжелательным партнёром',2],['Групповые задания, каждый раз в новом составе',1],['Еженедельный круг общения для всех детей',1],['Индивидуальные занятия с Алиной по развитию общения',0]],r:'Постоянный партнёр даёт устойчивый опыт безопасного контакта, который сложнее получить в больших группах. Смена составов полезна для класса, но для замкнутого ребёнка каждый раз новый риск. Круг общения работает на коллектив, но не решает проблему адресно. Индивидуальные занятия отделяют Алину от класса и закрепляют ощущение «проблемного ребёнка».'},
{k:'Ситуация: перемена',q:'Три девочки играют в резиночки, Алина стоит рядом третью перемену. Катя замечает её. Ваш ход?',o:[['Остаюсь рядом, не вмешиваясь, и поддержу, если Катя сама позовёт Алину',2],['Тихо предложу Алине присоединиться',1],['Попрошу Катю позже и поручу ей пригласить Алину',1],['Подойду и скажу: «Катя, возьми Алину играть»',0]],r:'Контакт, возникший у детей сам, прочнее заданного взрослым, а ваше присутствие даёт безопасность. Предложение Алине допустимо, но может выставить её на всеобщее внимание. Поручение Кате превращает приглашение в обязанность и портит искренность. Прямое указание вызывает формальное принятие и обиду.'},
{k:'Ситуация: конфликт',q:'Алина согласилась играть, проиграла и расплакалась. Девочки раздражены: «С ней неинтересно». Что вы сделаете?',o:[['Поговорю с девочками отдельно: проигрыш — часть игры, вместе придумаем правила поддержки',2],['Проведу общий классный разговор «как мы проигрываем»',1],['Успокою Алину и уберу из игры, чтобы не расстраивалась',0],['Скажу Алине, что надо уметь проигрывать',0]],r:'Работа с девочками формирует нормы поддержки внутри группы, где и возникла проблема. Общий разговор полезен, но менее точен и может выставить Алину примером. Уход из игры закрепляет избегание и подтверждает мысль «мне там не место». Нравоучение Алине обесценивает эмоции и добавляет вины.'},

Q('Диагностика','Третья драка Даниила за месяц. Перед разговором у вас есть час. Что делаете?','Опрос по отдельности даёт полную картину и не закрепляет роль «виноватого». Строгое предупреждение без фактов становится давлением. Публичный разбор унижает участников. Учёт без выяснения причин — формальная мера, которая ожесточает подростка.',[['Узнаю обстоятельства у участников по отдельности и у свидетелей, не называя виновных',2,'+I'],['Вызову Даниила и сразу объявлю, что ждёт его при повторе',1],['Разберу драку на классном часе при всех',0,'+X'],['Напишу докладную директору и поставлю на учёт',-1,'+X']]),

Q('Развилка: доверие','Даниил признаётся: «Они дразнят меня, что у меня нет отца. Я не выдерживаю». Что дальше?','Откровенность нужно поддержать без нереалистичных обещаний. Обещание защищать во всех конфликтах создаёт зависимость от педагога. Классный час на эту тему раскрывает его тайну. Совет «не реагировать кулаками» верен, но обесценивает боль.',[['Поблагодарю за откровенность и вместе обсудим, как ему действовать в таких ситуациях',2,'+C'],['Пообещаю защищать его перед классом и вмешиваться в каждый конфликт',1,'+D'],['Проведу классный час про уважение к семьям, назвав ситуацию',-1,'+X'],['Скажу, что на оскорбления не стоит отвечать кулаками',0]],{w:'T'}),

Q('Ситуация: учитель','Учитель физики жалуется: Даниил огрызается и срывает урок. Что вы предложите коллеге?','Единый подход с учителем и выяснение, что запускает конфликт, меняют причину. Дневник замечаний фиксирует, но не меняет поведение. Наказание при учителе превращает вас в «карателя». Игнорирование оставляет учителя без поддержки.',[['Договориться о единых правилах и выяснить, что запускает конфликты на этих уроках',2,'+I'],['Предложить вести дневник замечаний',1],['Сказать, что накажу сам, и вызвать Его на разбор при учителе',-1,'+X'],['Сказать, что это личное дело и надо пережить',0]]),
Q('Ресурс','Даниил хорошо играет в футбол, но тренировка совпадает с вашим классным часом. Ваше решение?','Спорт — ресурс самоуважения; важно связать его с ролью в классе. Пропуск классных часов делает ресурс «наградой» без воспитательной нагрузки. Условие «тренировки при отсутствии драк» отнимает опору. Бездействие упускает возможность.',[['Поддержу, договорюсь с тренером об обратной связи и дам роль капитана команды на школьном празднике',2,'+C'],['Разрешу пропускать классный час ради тренировок',1],['Поставлю условие: тренировки только при отсутствии драк',-1,'+X'],['Оставлю как есть, чтобы не усложнять',0]]),
Q('Ситуация: примирение','Одноклассник извиняется, но Даниил отвечает: «Мне не нужны ваши извинения». Как отреагируете?','Право отказаться и время подумать сохраняют достоинство и дают шанс на примирение. Требование принять извинения делает примирение обязанностью. Объявление отказа нарушением — давление. Вопрос без обратной связи закрывает диалог.',[['Скажу: «Хорошо, подумай; готов — скажешь» и вернусь через пару дней',2,'+T'],['Попрошу принять извинения, как принято',1],['Скажу, что отказ от примирения тоже нарушение',-1,'+X'],['Оставлю вопрос открытым без обсуждения',0,'-T']]),
Q('Рефлексия','Через два месяца конфликтов меньше, но был один срыв. Как вы подведёте итоги?','Разбор случая показывает, что работает, и закрепляет навыки. Похвала хороша, но без анализа не развивает. Снятие поощрений за срыв наказывает за откат и ломает процесс. Возврат к жёстким мерам подтверждает веру подростка, что он «плохой».',[['Разберу случай с Даниилом: где сработали новые способы и что закрепить',2,'+C'],['Отмечу динамику и похвалю на классном часе',1],['Отмечу срыв как нарушение договорённости и сниму поощрения',-2,'+X'],['Решу, что метод не работает, и вернусь к жёстким мерам',-1]])
],end:[{t:'Даниил научился решать конфликты без драк',d:'Даниил стал спокойнее: драки прекратились, на уроках он реже грубит, а в классе берёт на себя роль, связанную со спортом. Он доверяет вам и принимает правила, потому что понимает их смысл, а мама стала союзником школы.'},{t:'хрупкое перемирие',d:'Драки стали редкими, но мир держится на контроле и на вашем внимании. Даниил понимает правила, но при сильном напряжении может снова сорваться. Его навыки решения конфликтов остаются неустойчивыми.'},{t:'всё осталось по-прежнему',d:'Поведение Даниила не изменилось: драки и грубость продолжаются в прежнем ритме. Он не доверяет и не противостоит вам, просто воспринимает ваши шаги как формальность.'},{t:'Даниил стал ещё более агрессивным и замкнутым',d:'Давление и публичные меры привели к обратному эффекту: Даниил стал грубее, перестал разговаривать с вами и считает школу враждебной. Конфликты участились.'}]};
D.a.c[1]={...D.a.c[1],who:'ребёнок',q:[
Q('Диагностика','Урок за уроком Максим вскакивает и перебивает. С чего начнёте разбираться?','Карта наблюдений показывает, что запускает поведение. Мнения коллег полезны, но субъективны. Пересадка — одна мера без анализа. Дневник замечаний фиксирует поведение, а не причины, и обижает семью.',[['Веду карту наблюдений: когда, на каких заданиях и после чего это происходит',2,'+I'],['Прошу других учителей описать его поведение',1],['Пересаживаю на первую парту и смотрю, что изменится',0],['Записываю замечания в дневник как доказательства',-1,'+X']]),
Q('Беседа','Максим обиженно говорит: «Вы меня не любите, вы только ругаете». Что ответите?','Принятие чувства и совместный поиск решения формируют доверие. Общая фраза верна, но не отвечает на чувство. Обвинение усиливает обиду. Отмахивание обесценивает переживание.',[['«Я рада, когда ты работаешь. Давай придумаем, как тебе помочь не вскакивать»',2,'+T'],['«Я люблю всех детей, но правила для всех одинаковые»',1],['«Если бы ты не мешал, я бы не ругала»',-1,'-T'],['«Не обижайся, это не так» и меняю тему',0]]),
Q('Работа с семьёй','Папа: «К нему придираются, у других то же самое. Он обычный мальчик». Что сделаете?','Совместное наблюдение превращает спор в общий предмет изучения. Записи без диалога выглядят как обвинение. Ярлык «отрицают» закрывает разговор. Уход от темы оставляет семью без информации.',[['Приглашу на урок понаблюдать и вместе зафиксируем наблюдения',2,'+R'],['Покажу записи замечаний',1],['Скажу, что семья отрицает проблему',-1,'-R'],['Не буду спорить и перейду к другим темам',0]]),
Q('Развилка: доверие','Максим шепчет: «Мне трудно сидеть, ноги сами». Как поступите?','Конкретные приёмы переводят признание в практику. «Подойди ко мне» создаёт зависимость от педагога. Публичное объяснение выставляет ребёнка напоказ. «Потерпеть» обесценивает трудность.',[['Поблагодарю и договорюсь о приёмах: поручения, движение, сигнал «мне нужно встать»',2,'+C'],['Скажу: «Если трудно, подойди ко мне»',1,'+D'],['Расскажу классу, что Максиму трудно сидеть',-1,'+X'],['Скажу, что надо потерпеть',0]],{w:'T'}),
Q('Развилка: закрытость','Максим отмалчивается и вертит карандаш. Как продолжите?','Рисунок — безопасный способ говорить. Прямое «почему» вызывает защиту. Изъятие предмета унижает. Угроза звонком домой разрушает доверие.',[['Предложу вместе нарисовать «правила урока для меня»',2,'+T'],['Спрошу прямо, почему он вскакивает',1],['Заберу карандаш и посажу рядом с собой',-1,'+X'],['Скажу, что позвоню родителям',-1]],{nw:'T'}),
Q('Планирование','Какую цель вы поставите на месяц?','Цель — навыки саморегуляции, а не подавление. Время на месте измеримо, но вторично. Тишина — цель взрослого, не ребёнка. Разрешение на каждый шаг ведёт к зависимости.',[['Научить Максима 2–3 способам сдерживать импульсы вместе с ним',2,'+C'],['Добиться, чтобы он высиживал 20 минут урока',1],['Добиться тишины на уроках',0,'+X'],['Чтобы он спрашивал разрешения перед каждым действием',-1,'+D']]),
Q('Ситуация: урок','Максим выкрикнул ответ, перебив одноклассницу. Она обиделась. Ваша реакция?','Короткая реакция и поддержка успеха формируют навык. Замечание без разбора не учит. Публичная фраза закрепляет роль «мешающего». Игнорирование поощряет повторение.',[['Спокойно скажу: «Подожди сигнала», позже отмечу, когда он дождался',2,'+C'],['Сделаю замечание и продолжу урок',1],['«Ты опять мешаешь!» перед классом',-1,'+X'],['Сделаю вид, что не услышала',0]]),
Q('Ситуация: класс','Дети жалуются: «Максим не даёт играть». Что скажете?','Совместные правила дают ребёнку роль. Совет игнорировать оставляет жалобу без решения. Публичное извинение унижает. Отложенный разбор теряет момент.',[['Выслушаю и предложу детям и Максиму придумать правила игры вместе',2,'+C'],['Попрошу детей не обращать внимания',1],['Попрошу Максима извиниться перед всеми',-1,'+X'],['Скажу, что разберёмся позже',0]]),
Q('Родители','Мама просит: «Скажите коротко, стало ли лучше?» Что ответите?','Динамика с примерами делает родителей партнёрами. Фраза «стало лучше» без фактов не информирует. «Без изменений» без объяснения тревожит. Дневник с отметками — формальность.',[['Покажу динамику по карте наблюдений и скажу, какие приёмы работают',2,'+R'],['Скажу, что стало лучше',1],['Скажу, что изменений пока нет',-1],['Напишу в дневнике отметку',0]]),
Q('Рефлексия','Через месяц стало лучше, но случился срыв. Как оцените?','Анализ срыва показывает, что сработало. Продолжение без анализа не развивает. Снятие поощрений наказывает за откат. Передача специалисту без работы педагога — потеря шанса.',[['Разберу срыв с Максимом и закреплю удачные приёмы',2,'+C'],['Отмечу прогресс и продолжу',1],['Сниму поощрения за срыв',-2,'+X'],['Передам вопрос специалисту и отойду',-1]])
],end:[{t:'Максим научился справляться с импульсами',d:'Максим стал спокойнее: чаще ждёт сигнала, реже вскакивает и воспринимает замечания без обиды. Он доверяет вам и участвует в играх по правилам, а родители стали вашими союзниками.'},{t:'хрупкое перемирие',d:'Поведение Максима улучшилось, но держится на вашем контроле и поддержке. При усталости или волнении срывы возвращаются, а навыки самоконтроля пока нестабильны.'},{t:'всё осталось по-прежнему',d:'Максим по-прежнему вскакивает, перебивает и обижается на замечания. Ваши действия не изменили ни поведения, ни отношений с классом и семьёй.'},{t:'Максим стал более обидчивым и конфликтным',d:'Замечания и публичные меры усилили обиду: Максим сопротивляется, отказывается выполнять просьбы, а отношения с классом и семьёй ухудшились.'}]};
D.b.c[1]={...D.b.c[1],who:'подросток',q:[
Q('Диагностика','Полина почти всё время в телефоне, оценки падают. С чего начнёте?','Важно понять, что телефон даёт Полине: общение, игру или поддержку. Отзывы коллег субъективны. Запрос отчёта у родителей без разговора с ней — контроль. Общий запрет игнорирует причины.',[['Узнаю, чем она занята в сети: общение, игры или поддержка',2,'+I'],['Спрошу других учителей о её поведении',1],['Запрошу у родителей отчёт о времени в сети',0],['Объявлю телефонный запрет всему классу',-1,'+X']]),
Q('Беседа','Полина: «Это моё личное дело, оставьте меня». Что ответите?','Признание границы сохраняет контакт и показывает уважение. Спокойная просьба хороша, но не слышит чувств. Фраза «и моё дело» — давление. Закрытие разговора теряет шанс на диалог.',[['«Согласна, это твоё дело. Мне важно, чтобы тебе было хорошо в школе»',2,'+T'],['«Я не против телефона, но на уроках его не надо»',1],['«Пока ты в моём классе, это и моё дело»',-1,'-T'],['«Хорошо» и закончу разговор',0]]),
Q('Работа с семьёй','Папа: «Отберите у неё телефон, пусть учится». Что сделаете?','Согласованные правила лучше запрета: они сохраняют доверие. Запрет на неделю даёт краткий эффект. Перекладывание на семью разрывает сотрудничество. Уход от темы оставляет без плана.',[['Объясню, что запрет усилит скрытность, предложу общие правила дома и в школе',2,'+R'],['Соглашусь на запрет на неделю',1],['Скажу, что воспитание — дело семьи',-1,'-R'],['Уйду от темы',0]]),
Q('Развилка: доверие','Полина: «В сети меня понимают, в классе нет». Как поступите?','Расспрос о том, что ценно, помогает найти аналог в школе. Роль «замены сети» создаёт зависимость. Публичное объяснение раскрывает личное. Страшилки обесценивают её опыт.',[['Спрошу, что именно её там понимают, и предложу найти такое в школе',2,'+C'],['Скажу, что готова общаться с ней вместо сети',1,'+D'],['Расскажу классу, что Полине одиноко',-1,'+X'],['Скажу, что в сети много опасностей',0]],{w:'T'}),
Q('Развилка: протест','Полина демонстративно достаёт телефон на уроке. Ваши действия?','Тихая просьба и разговор позже сохраняют достоинство. Изъятие допустимо, но обостряет конфликт. Публичная угроза — давление. Игнорирование закрепляет правило «можно».',[['Тихо попрошу убрать, позже поговорю наедине',2,'+T'],['Заберу телефон до конца урока',1],['Скажу на весь класс, что поставлю «неуд»',-1,'+X'],['Сделаю вид, что не заметила',-1]],{nw:'T'}),
Q('Планирование','Какую цель поставите на два месяца?','Цель — офлайн-интерес и контакты, а не просто меньше телефона. Ограничение на уроках измеримо, но вторично. Полный отказ нереалистичен. Отчёты о каждом использовании — контроль.',[['Помочь найти офлайн-занятие и 1–2 контакта в классе',2,'+C'],['Сократить время в телефоне на уроках',1],['Добиться полного отказа от телефона в школе',0,'+X'],['Чтобы Полина сообщала мне о каждом использовании',-1,'+D']]),
Q('Ситуация: конфликт','Одноклассница: «Полина выложила про меня обидный пост». Ваш ход?','Сначала факты, затем беседы по отдельности. Просьба удалить пост решает часть. Классный час при всех унижает. Отказ «это за пределами школы» оставляет пострадавшую без защиты.',[['Выясню факты, поговорю с каждой отдельно, напомню правила общения в сети',2,'+I'],['Попрошу Полину удалить публикацию',1],['Разберу на классном часе при всех',-1,'+X'],['Скажу, что это вне школы',0]]),
Q('Ситуация: контрольная','У Полины на контрольной звонит телефон. Что сделаете?','Правило, принятое вместе, работает лучше наказания. Изъятие — формальная мера. Снижение оценки за поведение смешивает учёбу и дисциплину. Невмешательство размывает правила.',[['Предложу правило: телефон в коробке на уроке, обсудим результат через месяц',2,'+C'],['Заберу и верну после уроков',1],['Занижу оценку за контрольную',-1,'+X'],['Не буду реагировать',0]]),
Q('Ресурс','Полина хорошо снимает видео. Как используете?','Реальная роль в школе превращает интерес в связь с классом. Кружок вне школы полезен, но менее связан с классом. Условие «проект только без телефона» наказывает за интерес. Бездействие упускает шанс.',[['Предложу школьный видеопроект и роль оператора',2,'+C'],['Порекомендую кружок вне школы',1],['Поставлю условие: проект, только если на уроках нет телефона',-1,'+X'],['Оставлю как есть',0]]),
Q('Рефлексия','Через два месяца Полина реже в телефоне, но снова сорвалась. Как оцените?','Разбор помогает увидеть, что сработало. Просто отметить прогресс недостаточно. Возврат запрета подтверждает недоверие. Вывод «метод не работает» преждевременен.',[['Разберу с ней, что помогло и где было трудно',2,'+C'],['Отмечу прогресс и продолжу',1],['Верну жёсткий запрет',-2,'+X'],['Решу, что метод не работает',-1]])
],end:[{t:'Полина нашла опору в школе и стала активнее',d:'Полина стала реже уходить в телефон: она участвует в школьном видеопроекте, общается с одноклассниками и сама рассказывает о своих делах. Вы сохранили её доверие и согласовали правила с семьёй.'},{t:'хрупкое перемирие',d:'Телефона на уроках стало меньше, но интерес к школе держится на вашем внимании. Контакты с одноклассниками пока нестабильны, а срывы остаются возможными.'},{t:'всё осталось по-прежнему',d:'Полина по-прежнему общается в основном онлайн, а учёба не улучшилась. Ваши действия не изменили ни её отношения к школе, ни контактов с классом.'},{t:'Полина стала ещё более закрытой',d:'Запреты и давление привели к противоположному результату: Полина скрывает телефон, избегает разговоров и всё больше уходит в сеть.'}]};
D.c.c[0]={...D.c.c[0],who:'подросток',q:[
Q('Диагностика','Софья волнуется из-за экзаменов и выбора профессии, срывается на близких. С чего начнёте?','Важно выяснить, что именно пугает: экзамены, выбор или ожидания родителей. Тест на профориентацию без разговора формален. Мнения коллег — вторичны. «Возьми себя в руки» обесценивает чувства.',[['Спрошу, что именно пугает: экзамены, выбор профессии или ожидания родителей',2,'+I'],['Предложу тест по профориентации сразу',1],['Попрошу коллег описать её поведение',0],['Скажу, что нужно успокоиться и взять себя в руки',-1,'+X']]),
Q('Беседа','Софья: «Если я не поступлю, меня никто не поймёт». Что ответите?','Отражение чувства и вопрос раскрывают источник страха. Утешение «ты способная» не отвечает на тревогу. «Пустяки» обесценивает. «Это нормально» закрывает разговор.',[['«Это тяжёлое чувство. Расскажи, чьего понимания тебе не хватает»',2,'+T'],['«Ты способная, поступишь»',1],['«Не переживай по пустякам»',-1,'-T'],['«Это нормально для твоего возраста»',0]]),
Q('Работа с семьёй','Мама: «Медицинский — это её будущее». Что сделаете?','Встреча с участием Софьи уважает обе стороны. Результаты диагностики без диалога — информирование. Обвинение в давлении закрывает сотрудничество. Невмешательство оставляет Софью одну.',[['Предложу встречу: послушаем интересы Софьи и обсудим варианты вместе',2,'+R'],['Покажу результаты профдиагностики',1],['Скажу, что давление родителей вредно',-1,'-R'],['Не буду вмешиваться',0]]),
Q('Развилка: доверие','Софья признаётся: «Мне нравится дизайн, но мама против». Что дальше?','Изучение обоих путей даёт основу для выбора. Роль «союзника против мамы» создаёт зависимость. Оценка маминой позиции — давление. «Есть время» обесценивает тревогу.',[['Поддержу и предложу изучить оба пути: экскурсии, открытые уроки, встречи с практиками',2,'+C'],['Скажу, что буду её союзником перед мамой',1,'+D'],['Скажу, что мама не права',-1,'+X'],['Скажу, что ещё есть время',0]],{w:'T'}),
Q('Развилка: закрытость','Софья молчит и смотрит в тетрадь. Как продолжите?','Готовность подождать оставляет дверь открытой. Прямой вопрос «всё ли в порядке» вызывает автоматическое «да». Давление «молчание не поможет» усиливает замкнутость. Передача психологу без её ведома рвёт доверие.',[['Скажу, что готова подождать, и предложу написать мне записку',2,'+T'],['Спрошу, всё ли в порядке',1],['Скажу, что молчание не поможет',-1,'+X'],['Передам вопрос психологу без её ведома',-1]],{nw:'T'}),
Q('Планирование','Какую цель поставите?','Цель — набор вариантов и критериев выбора. «Единственно верный выбор» подменяет решение Софьи. Согласие с мамой — цель взрослых. Совет по каждому решению создаёт зависимость.',[['Помочь Софье составить 2–3 варианта пути и критерии выбора',2,'+C'],['Сформулировать единственный правильный выбор',1],['Добиться согласия с мамой',0,'+X'],['Чтобы Софья советовалась со мной по каждому решению',-1,'+D']]),
Q('Ситуация: пробный экзамен','Перед пробным экзаменом Софья: «Я ничего не помню». Что сделаете?','Короткий план и пауза возвращают контроль. Общее «получится» не помогает. Угроза последствиями усиливает тревогу. Отправка к психологу без поддержки — формальность.',[['Предложу спокойный план на день и короткую паузу',2,'+I'],['Скажу: «Ты подготовлена, всё получится»',1],['Скажу: «Не сдашь — будут проблемы»',-1,'+X'],['Отправлю к психологу',0]]),
Q('Ситуация: класс','Одноклассники обсуждают баллы, Софья уходит в слезах. Ваши действия?','Групповая взаимопомощь снимает сравнение и даёт опору. «Баллы не главное» верно, но не решает ситуацию. Публичное требование не сравнивать унижает. Невмешательство оставляет Софью одну.',[['Подойду позже и предложу объединиться в группу взаимопомощи',2,'+C'],['Скажу, что баллы — не главное',1],['Публично попрошу класс не сравнивать',-1,'+X'],['Не буду вмешиваться',0]]),
Q('Ресурс','Софья увлекается дизайном. Как используете?','Реальный проект даёт опыт и уверенность. Кружок полезен, но слабее связан со школой. «Дизайн — хобби» обесценивает интерес. Бездействие упускает возможность.',[['Предложу проект оформления школьного мероприятия',2,'+C'],['Посоветую кружок',1],['Скажу, что дизайн — хобби, а не профессия',-1,'+X'],['Оставлю как есть',0]]),
Q('Рефлексия','К весне Софья хочет подать документы и в медицинский, и в дизайн-колледж. Как подведёте итог?','Помощь сформулировать причины выбора делает решение осознанным. «Это твой выбор» без разбора оставляет одну. Оценка «дизайн — риск» давит. Передача решения родителям лишает её роли.',[['Помогу сформулировать выбор и причины, согласую с семьёй',2,'+C'],['Скажу, что это её выбор',1],['Скажу, что дизайн — риск',-2,'+X'],['Передам решение родителям',-1]])
],end:[{t:'Софья приняла осознанное решение и стала спокойнее',d:'Софья снизила тревогу, сформулировала варианты и причины выбора и подаёт документы в оба направления. Родители услышали её интересы и стали поддерживать, а вы остались для неё опорой.'},{t:'хрупкое равновесие',d:'Тревога снизилась, но выбор остаётся неопределённым, а разговоры с мамой напряжены. Софья в основном опирается на вас, и без вашей поддержки уверенность быстро снижается.'},{t:'всё осталось по-прежнему',d:'Софья по-прежнему тревожится, а выбор профессии не определён. Ваши действия не изменили ни её состояния, ни позиции родителей.'},{t:'Софья стала ещё более тревожной и замкнутой',d:'Давление и обесценивание привели к обратному: Софья реже обращается за помощью, сильнее переживает и скрывает свои интересы.'}]};
D.a.c[2]={...D.a.c[2],who:'ребёнок',q:[
Q('Диагностика','Ярослав приходит без желания и плачет на переменах. С чего начнёте?','Наблюдение и личная беседа дают факты без новых обид. Расспросы класса могут усилить травлю. Публичный поиск виноватых унижает пострадавшего. Совет игнорировать оставляет его одного.',[['Понаблюдаю за классом и переменами, затем поговорю с ним наедине',2,'+I'],['Спрошу у одноклассников, что происходит',1],['Соберу класс и спрошу, кто обижает Ярослава',-1,'+X'],['Посоветую Ярославу не обращать внимания',0]]),
Q('Беседа','Ярослав: «Я тупой, меня все так называют». Что ответите?','Сочувствие и просьба рассказать открывают разговор. Похвала за рисование отвлекает от боли. «Они глупые» закрепляет вражду. «Это пройдёт» обесценивает переживание.',[['«Мне жаль, что тебе это говорят. Расскажи, когда это случается»',2,'+T'],['«Ты не тупой, ты хорошо рисуешь»',1],['«Не слушай, они просто глупые»',-1,'-T'],['«Это пройдёт»',0]]),
Q('Работа с семьёй','Родители ничего не знали о ситуации. Как сообщите им?','Факты и общий план делают родителей союзниками. Запись в дневнике не даёт диалога. Идея «закалять» обесценивает боль ребёнка. Ожидание теряет время.',[['Позвоню, расскажу факты и предложу совместный план',2,'+R'],['Напишу запись в дневник',1],['Скажу, что ребёнка надо закалять',-1,'-R'],['Подожду, пока заметят сами',0]]),
Q('Развилка: доверие','Ярослав: «Я стесняюсь читать вслух, они смеются». Что сделаете?','Чтение в паре со знакомым снижает тревогу и даёт опыт успеха. Занятия отдельно привязывают к педагогу. Призыв к классу выставляет Ярослава слабым. Освобождение закрепляет избегание.',[['Предложу читать вдвоём с другом, сначала тихо',2,'+C'],['Буду читать с ним отдельно после уроков',1,'+D'],['Скажу классу не смеяться над Ярославом',-1,'+X'],['Освобожу от чтения вслух',0]],{w:'T'}),
Q('Развилка: закрытость','Ярослав отворачивается и не хочет говорить. Как продолжите?','Прогулка по коридору — неформальный формат разговора. Прямое «что мешает» требует ответа. Условие «расскажи, иначе не помогу» — давление. Звонок родителям при нём предаёт доверие.',[['Предложу поговорить во время прогулки по коридору',2,'+T'],['Скажу, что хочу помочь, и спрошу, что мешает говорить',1],['Скажу, что не помогу, пока не расскажет',-1,'+X'],['Позвоню родителям при нём',-1]],{nw:'T'}),
Q('Планирование','Какую цель поставите на месяц?','Цель — место в коллективе: роль и 1–2 друга. Навык чтения важен, но не решает изоляцию. Извинения обидчиков формальны. Просьба обращаться ко мне при каждой обиде создаёт зависимость.',[['Помочь найти место в классе: роль и 1–2 друга',2,'+C'],['Улучшить навык чтения',1],['Добиться извинений обидчиков',0,'+X'],['Чтобы Ярослав обращался ко мне при каждой обиде',-1,'+D']]),
Q('Ситуация: перемена','Одноклассник передразнивает Ярослава на перемене при вас. Что сделаете?','Спокойное прекращение без упоминания Ярослава сохраняет его достоинство. Замечание без разбора не учит. Принудительные извинения закрепляют вражду. Невмешательство разрешает насмешки.',[['Спокойно остановлю, не называя Ярослава, позже поговорю с обоими',2,'+C'],['Сделаю замечание',1],['Заставлю извиниться при всех',-1,'+X'],['Не буду вмешиваться',0]]),
Q('Ситуация: чтение','На уроке очередь читать вслух дошла до Ярослава. Что сделаете?','Подготовка и чтение по частям дают опыт успеха. Вызов другого уберёт ситуацию, но не навык. «Чтобы привыкал» — давление. Полное освобождение закрепляет страх.',[['Дам текст заранее и разрешу читать по частям',2,'+C'],['Вызову другого ученика',1],['Вызову Ярослава, чтобы привыкал',-1,'+X'],['Больше не буду спрашивать вслух',0]]),
Q('Ресурс','Ярослав хорошо рисует. Как используете?','Совместная работа в паре создаёт общее дело и статус. Показ работ классу полезен, но без дела остаётся разовым. Сравнение с чтением обесценивает. Кружок вне школы слабо связан с классом.',[['Поручу оформить стенгазету в паре с одноклассником',2,'+C'],['Покажу его работы классу',1],['Скажу, что рисование не заменит чтение',-1,'+X'],['Предложу кружок вне школы',0]]),
Q('Работа с классом','Как будете работать с классом?','Ролевая игра об уважении без упоминания Ярослава меняет нормы класса. Беседа о правилах слишком общая. Разбор конкретных детей — публичный. Молчание сохраняет проблему.',[['Классный час с ролевой игрой об уважении без упоминания Ярослава',2,'+C'],['Беседа о правилах поведения',1],['Разберу поведение конкретных детей',-1,'+X'],['Не буду поднимать тему',0]]),
Q('Рефлексия','Через месяц стало лучше, но отдельные дети продолжают дразнить. Как оцените?','Итог с Ярославом и продолжение работы с классом закрепляют результат. Простое «прогресс» не решает остаточных случаев. Публичный выговор усилит вражду. «Решено» закрывает процесс раньше времени.',[['Подведу итог с Ярославом и продолжу работу с классом',2,'+C'],['Отмечу прогресс',1],['Сделаю выговор зачинщикам при всех',-2,'+X'],['Решу, что проблема решена',-1]])
],end:[{t:'Ярослав стал увереннее и нашёл друзей в классе',d:'Ярослав стал спокойнее приходить в школу: у него есть друзья, он участвует в общих делах и без страха читает в классе. Он доверяет вам, а класс перестал смеяться, потому что понял, как это ранит.'},{t:'хрупкое перемирие',d:'Насмешки стали реже, но Ярослав всё ещё чувствует себя уязвимым и держится рядом с вами. Ситуация улучшилась, но без дальнейшей работы с классом может вернуться.'},{t:'всё осталось по-прежнему',d:'Ярослав по-прежнему сам по себе: насмешки продолжаются, а в школу он идёт без желания. Ваши действия не изменили ни его положения, ни отношения класса.'},{t:'Ярослав стал ещё более замкнутым',d:'Публичность и давление усилили обиду: Ярослав перестал рассказывать вам о происходящем, чаще плачет и избегает одноклассников. Нужно вернуть доверие и убрать давление.'}]};
D.b.c[2]={...D.b.c[2],who:'подросток',q:[
Q('Диагностика','Артём, 15 лет, пропускает уроки и говорит: «Мне это не пригодится». С чего начнёте?','Беседа и сравнение с прошлым годом показывают, что изменилось. Опрос друзей полезен, но косвенен. Учёт без причин — формальная мера. Справка закрывает формальную сторону, а не причину.',[['Поговорю с Артёмом и учителями, сравню с прошлым годом',2,'+I'],['Выясню у друзей',1],['Поставлю на внутришкольный учёт',-1,'+X'],['Запрошу справку об уважительных причинах',0]]),
Q('Беседа','Артём: «Зачем мне это, всё равно не пригодится». Что ответите?','Вопрос о его представлении о нужном приглашает к диалогу. Довод про аттестат формален. «Все так говорят, а потом жалеют» обесценивает. «Это временно» закрывает разговор.',[['«Расскажи, что, по-твоему, тебе пригодится»',2,'+T'],['«Без аттестата никуда не возьмут»',1],['«Все так говорят, а потом жалеют»',-1,'-T'],['«Это временно»',0]]),
Q('Работа с семьёй','Отец: «Мы с ним говорили, он просто ленится». Что сделаете?','Общий план без обвинений делает отца союзником. Информирование о пропусках — минимум. Тезис «недооцениваете» закрывает диалог. Молчание теряет возможность.',[['Предложу встречу и общий план без обвинений',2,'+R'],['Сообщу о пропусках',1],['Скажу, что семья недооценивает проблему',-1,'-R'],['Промолчу',0]]),
Q('Развилка: доверие','Артём признаётся: «Я не вижу, кем быть». Что сделаете?','Профпробы дают опыт и ориентиры. Обещание «подберу сама» создаёт зависимость. «Ты не думал» обесценивает. Тест — лишь часть решения.',[['Предложу профпробы: встречи, экскурсии',2,'+C'],['Скажу, что подберу профессию вместе',1,'+D'],['Скажу «ты просто не думал»',-1,'+X'],['Посоветую пройти тест',0]],{w:'T'}),
Q('Развилка: закрытость','Артём молчит и смотрит в сторону. Как продолжите?','Предложение вернуться к разговору даёт безопасность. Вопрос «что мешает» требует ответа. Предупреждение о последствиях — давление. Передача родителям разрушает доверие.',[['Скажу, что подожду, и предложу написать мне',2,'+T'],['Спрошу, что мешает говорить',1],['Предупрежу о последствиях пропусков',-1,'+X'],['Передам родителям',-1]],{nw:'T'}),
Q('Планирование','Какую цель поставите?','Связь предметов с интересами — основа мотивации. Посещаемость вторична. Оценки на «4» — внешняя цель. Ежедневный отчёт — зависимость.',[['Помочь увидеть связь предметов с интересами и составить план',2,'+C'],['Вернуть посещаемость',1],['Добиться оценок на «4»',0,'+X'],['Чтобы он отчитывался мне ежедневно',-1,'+D']]),
Q('Ситуация: учитель','Артём пришёл после пропуска, учитель делает ему замечание. Что сделаете?','Спокойный разговор с обоими не усиливает конфликт. Поддержка учителя необходима, но без Артёма недостаточна. Разбор при классе унижает. Невмешательство оставляет конфликт.',[['Спокойно поговорю с учителем и Артёмом после урока',2,'+C'],['Поддержу учителя',1],['Разберу при классе',-1,'+X'],['Не буду вмешиваться',0]]),
Q('Ситуация: класс','Одноклассники: «Артём может не ходить, ему всё равно». Что скажете?','Разговор о ценности выбора без Артёма снимает давление. «Все обязаны» верно, но формально. Показательный пример унижает. Невмешательство разрешает сплетни.',[['Поговорю с классом о ценности выбора, не называя Артёма',2,'+C'],['Скажу, что все обязаны ходить',1],['Назову Артёма примером плохого',-1,'+X'],['Не вмешиваюсь',0]]),
Q('Ресурс','Артём увлекается игрой на гитаре. Как используете?','Школьный проект и профпробы связывают интерес с будущим. Хобби — признание без развития. «Музыка — не профессия» обесценивает. Оставить как есть — упустить ресурс.',[['Свяжу с проектом: школьный концерт и профпробы',2,'+C'],['Одобрю как хобби',1],['Скажу, что музыка — не профессия',-1,'+X'],['Оставлю как есть',0]]),
Q('Учебный план','Как оформите план возвращения к учёбе?','Индивидуальный план с датами делает цель понятной. Доп. занятия без мотива не работают. Ультиматум — давление. Ничего не менять — потеря времени.',[['Составлю индивидуальный план с шагами и датами',2,'+C'],['Назначу дополнительные занятия',1],['Поставлю ультиматум',-1,'+X'],['Ничего не буду менять',0]]),
Q('Рефлексия','Артём вернулся к занятиям, но снова пропустил день. Как оцените?','Разбор срыва показывает, что сработало. Похвала без разбора не развивает. Возврат прежних мер наказывает за откат. «План не работает» — преждевременный вывод.',[['Разберу вместе, что получилось и что мешало',2,'+C'],['Похвалю за возвращение',1],['Верну прежние меры',-2,'+X'],['Решу, что план не работает',-1]])
],end:[{t:'Артём вернул интерес к учёбе и определился с целью',d:'Артём снова ходит на занятия, видит связь школы со своими интересами и участвует в школьных делах. Он доверяет вам, а семья стала союзником.'},{t:'хрупкая мотивация',d:'Артём вернулся к урокам, но цель остаётся размытой, а мотивация держится на контроле. Нужна дальнейшая работа над планом и поддержка семьи.'},{t:'всё осталось по-прежнему',d:'Артём продолжает пропускать уроки и не видит смысла в учёбе. Ваши действия не повлияли на его мотивацию.'},{t:'Артём ещё больше отдалился от школы',d:'Давление и формальные меры укрепили его уверенность, что школа не нужна: пропусков стало больше, а разговаривать он перестал.'}]};
D.c.c[1]={...D.c.c[1],who:'подросток',q:[
Q('Диагностика','Кирилл спорит с классным руководителем и срывает мероприятия. С чего начнёте?','Наблюдение и разговор с ним и классом показывают причины. Мнения учителей субъективны. Вызов к директору — давление. Игнорирование усиливает протест.',[['Понаблюдаю, когда он срывает, и поговорю с ним и с классом',2,'+I'],['Соберу мнения учителей',1],['Вызову к директору',-1,'+X'],['Проигнорирую',0]]),
Q('Беседа','Кирилл: «Ваши мероприятия — ерунда». Что ответите?','Вопрос о его видении превращает критику в диалог. «Для порядка» формален. «Не тебе судить» обрывает разговор. «Ладно» — уход от темы.',[['«Что бы ты сделал по-другому?»',2,'+T'],['«Они нужны для порядка»',1],['«Не тебе судить»',-1,'-T'],['«Ладно»',0]]),
Q('Работа с семьёй','Мама: «У него просто переходный возраст». Как ответите?','Общий взгляд без обвинений сохраняет сотрудничество. Показ наблюдений информирует, но без диалога. «Воспитание упущено» оскорбляет. Согласие без анализа бесполезно.',[['Предложу вместе посмотреть на ситуацию без обвинений',2,'+R'],['Покажу свои наблюдения',1],['Скажу, что воспитание упущено',-1,'-R'],['Соглашусь с мамой',0]]),
Q('Развилка: доверие','Кирилл: «Мне нечем заняться, всё скучно». Что сделаете?','Предложение организовать самому использует лидерство. «Подберу занятие» создаёт зависимость. «Надо работать» обесценивает. Секция — вне школы.',[['Предложу организовать мероприятие самому',2,'+C'],['Скажу, что подберу занятие',1,'+D'],['Скажу, что надо просто работать',-1,'+X'],['Посоветую секцию',0]],{w:'T'}),
Q('Развилка: протест','Кирилл демонстративно уходит с урока. Что сделаете?','Готовность поговорить позже сохраняет достоинство. Догнать и спросить — допустимо, но на эмоциях. Запись прогула усиливает протест. Звонок родителям — эскалация.',[['Скажу, что готов обсудить позже',2,'+T'],['Догоню и спрошу, что случилось',1],['Запишу прогул',-1,'+X'],['Вызову родителей',-1]],{nw:'T'}),
Q('Планирование','Какую цель поставите?','Включение лидерства в общее дело направляет энергию. «Прекратить срывы» — запрет. Признание авторитета — цель взрослого. Консультации у меня — зависимость.',[['Включить его лидерство в организацию общего дела',2,'+C'],['Прекратить срывы',1],['Добиться признания авторитета классного',0,'+X'],['Чтобы он консультировался со мной',-1,'+D']]),
Q('Ситуация: классный час','Кирилл: «Это бессмысленно», класс смеётся. Что сделаете?','Вопрос «что бы ты предложил» включает его в обсуждение. Удаление — быстрый, но формальный способ. Выговор при всех усиливает протест. Игнорирование поощряет повторение.',[['Спокойно спрошу, что бы он предложил, и включу в обсуждение',2,'+C'],['Попрошу выйти',1],['Сделаю выговор при всех',-1,'+X'],['Продолжу, как будто ничего не было',0]]),
Q('Ситуация: инициатива','Кирилл предлагает свой формат мероприятия. Как поступите?','Поддержка с согласованием правил делает его соавтором. Частичное разрешение — компромисс. «Мы уже решили» отталкивает. Отложить — потерять момент.',[['Поддержу и помогу с ресурсами, согласуем правила',2,'+C'],['Разрешу частично',1],['Откажу: «мы уже всё решили»',-1,'+X'],['Отложу на потом',0]]),
Q('Ресурс','Класс идёт за Кириллом. Как используете?','Ответственность за часть проекта превращает влияние в пользу. Похвала на линейке формальна. Просьба «сдерживать класс» перекладывает вашу задачу. Невмешательство упускает ресурс.',[['Назначу ответственным за часть общего проекта',2,'+C'],['Похвалю на линейке',1],['Попрошу его сдерживать класс',-1,'+X'],['Не буду ничего менять',0]]),
Q('Итог проекта','Проект получился, но Кирилл говорит: «Это ваша заслуга». Что ответите?','Признание вклада и вопрос о улучшениях укрепляют ответственность. «Общая заслуга» верно, но размыто. «Драматизируешь» обесценивает. Молчание теряет момент.',[['Отмечу его вклад и спрошу, что он улучшил бы',2,'+T'],['Скажу, что это общая заслуга',1],['Скажу, что он драматизирует',-1,'+X'],['Промолчу',0]]),
Q('Рефлексия','Как подведёте итоги работы?','Рефлексия с Кириллом и классом закрепляет опыт. Похвала без разбора формальна. Возврат контроля ломает доверие. Оставить без итогов — потерять эффект.',[['Проведу рефлексию с Кириллом и классом',2,'+C'],['Похвалю его',1],['Верну прежний контроль',-2,'+X'],['Оставлю без итогов',-1]])
],end:[{t:'Кирилл стал лидером общего дела',d:'Кирилл перестал срывать мероприятия: он сам организует часть проекта, прислушивается к классу и спорит по существу. Он доверяет вам, потому что видит, что его мнение учитывается.'},{t:'хрупкий союз',d:'Срывы стали реже, но Кирилл продолжает проверять границы, а доверие держится на вашей поддержке. Нужна дальнейшая работа над ролью и ответственностью.'},{t:'всё осталось по-прежнему',d:'Кирилл по-прежнему спорит и срывает мероприятия. Ваши действия не изменили ни его отношения, ни позиции класса.'},{t:'Кирилл стал ещё более протестным',d:'Давление и публичные меры усилили протест: Кирилл открыто противостоит классному руководителю, а класс всё чаще поддерживает его.'}]};
D.c.c[2]={...D.c.c[2],who:'подросток',q:[
Q('Диагностика','В классном чате насмехаются над Вероникой. С чего начнёте?','Беседа с пострадавшей, фиксация ситуации и подключение психолога обеспечивают безопасность. Скриншоты у класса вовлекают лишних. Резкое сообщение в чат — эскалация. Ожидание теряет время.',[['Поговорю с Вероникой отдельно, зафиксирую и привлеку психолога',2,'+I'],['Попрошу скриншоты у класса',1],['Напишу в чат резкое сообщение',-1,'+X'],['Подожду, не вмешиваясь',0]]),
Q('Беседа','Вероника: «Я не хочу, чтобы вы что-то делали». Что ответите?','Согласие с границей и вопрос о форме помощи сохраняют доверие. «Обязана вмешаться» верно, но давит. «Ты должна рассказать» — давление. «Ладно» оставляет без защиты.',[['«Хорошо, но мне важно, чтобы тебе было безопасно. Как лучше помочь?»',2,'+T'],['«Я обязана вмешаться»',1],['«Ты должна рассказать всё»',-1,'-T'],['«Ладно»',0]]),
Q('Работа с семьёй','Родители Вероники просят не придавать огласки. Как поступите?','Согласование деликатных шагов сохраняет сотрудничество. Обещание ничего не делать оставляет без защиты. «Мы обязаны действовать» разрывает диалог. Без согласования — риск потерять доверие.',[['Объясню, что шаги будут деликатными, и согласую их',2,'+R'],['Пообещаю ничего не делать',1],['Скажу, что мы обязаны действовать',-1,'-R'],['Не буду ничего согласовывать',0]]),
Q('Развилка: доверие','Вероника: «Мне стыдно, я не хочу в школу». Что сделаете?','Безопасная схема посещения сохраняет достоинство и связь со школой. Предложение приходить ко мне создаёт зависимость. Рассказ классу раскрывает личное. Освобождение закрепляет избегание.',[['Поддержу и договорюсь о безопасной схеме посещения',2,'+C'],['Скажу, что она может приходить ко мне',1,'+D'],['Скажу классу, что Веронике тяжело',-1,'+X'],['Освобожу от занятий',0]],{w:'T'}),
Q('Развилка: закрытость','Вероника не отвечает на сообщения. Что сделаете?','Оставленная возможность вернуться сохраняет шанс на доверие. Звонок — допустим, но может давить. «Вопрос серьёзный» пугает. Передача директору без её ведома разрывает доверие.',[['Оставлю возможность прийти, когда будет готова',2,'+T'],['Позвоню ей',1],['Скажу, что вопрос серьёзный',-1,'+X'],['Передам директору',-1]],{nw:'T'}),
Q('Работа с лидером','Зачинщик — Диана, неформальный лидер. Как поступите?','Беседа о влиянии лидера опирается на её роль. Вызов с родителями — допустим, но эскалация. Публичный выговор порождает вражду. Невмешательство оставляет всё.',[['Побеседую с Дианой о влиянии лидера и ответственности',2,'+C'],['Вызову её с родителями',1],['Объявлю выговор при классе',-1,'+X'],['Не буду вмешиваться',0]]),
Q('Планирование','Какую цель поставите?','Безопасная атмосфера и правила чата — основа. Закрытие чата не меняет отношений. Наказание зачинщиков — реакция. Отчёты Вероники создают зависимость.',[['Восстановить безопасную атмосферу и договориться о правилах чата',2,'+C'],['Закрыть чат',1],['Наказать зачинщиков',0,'+X'],['Чтобы Вероника сообщала мне о каждом случае',-1,'+D']]),
Q('Ситуация: чат','В чате снова обидные сообщения. Что сделаете?','Фиксация, психолог и родители — системный ответ. Удаление чата — быстрое, но не меняет отношений. Ответ в чате — эскалация. Игнорирование разрешает травлю.',[['Зафиксирую, подключу психолога и родителей',2,'+I'],['Удалю чат',1],['Напишу ответ в чат',-1,'+X'],['Проигнорирую',0]]),
Q('Разговор с Дианой','Диана: «Это просто шутки». Что ответите?','Вопрос о чувствах Вероники даёт Диане осмыслить. Объяснение последствий верно, но формально. «Ты виновата» вызывает защиту. «Понятно» оставляет без результата.',[['«Давай обсудим, как это чувствует Вероника»',2,'+T'],['Объясню последствия',1],['Скажу, что она виновата',-1,'+X'],['Скажу «понятно»',0]]),
Q('Классный час','Какой формат выберете?','Тренинг на сплочение и выработка правил меняют нормы. Беседа о буллинге — слишком общая. Назвать участников — публичное осуждение. Отказ оставляет проблему.',[['Тренинг на сплочение и выработка правил общения',2,'+C'],['Беседа о буллинге',1],['Назову участников',-1,'+X'],['Не буду проводить',0]]),
Q('Рефлексия','Как подведёте итоги?','Итоги с Вероникой, Дианой и родителями закрепляют правила. «Вопрос решён» — преждевременно. Выговор усиливает вражду. Закрытие темы теряет результат.',[['Подведу итоги с Вероникой, Дианой и родителями, закреплю правила',2,'+C'],['Скажу, что вопрос решён',1],['Объявлю выговор',-2,'+X'],['Закрою тему',-1]])
],end:[{t:'Вероника вернулась в коллектив, травля остановлена',d:'Травля в чате прекратилась: у класса появились правила общения, Вероника снова общается с одноклассниками, а Диана стала осознаннее использовать своё влияние. Вы защитили Веронику и сохранили доверие.'},{t:'хрупкое перемирие',d:'Травля стала тише, но отношения остаются напряжёнными, а Вероника всё ещё осторожна в классе. Нужна дальнейшая работа над нормами коллектива.'},{t:'всё осталось по-прежнему',d:'Травля продолжается в прежнем виде, Вероника остаётся в изоляции. Ваши действия не изменили ни норм в классе, ни позиции Дианы.'},{t:'Вероника стала ещё более изолированной',d:'Публичные меры и давление усилили травлю: Вероника замкнулась, перестала говорить с вами, а класс стал враждебнее. Нужно восстанавливать безопасность и доверие.'}]};
